<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Contact | Christian Escalada</title>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col selection:bg-cyan-500/30">

   <nav class="p-6 border-b border-slate-800">
    <div class="container mx-auto flex flex-col md:flex-row justify-between items-center">
      <h1 class="text-xl font-bold tracking-widest text-blue-500 mb-4 md:mb-0">Fallout Navarro</h1>
      <ul class="flex space-x-6 text-sm uppercase font-semibold">
      <li><a href="index.html" class="hover:text-blue-500 transition">Home</a></li>
        <li><a href="About.html" class="hover:text-blue-500 transition">About</a></li>
        <li><a href="Shop.html" class="hover:text-blue-500 transition">Shop</a></li>
        <li><a href="Contact.html" class="text-blue-500 border-b-2 border-blue-500 pb-1">Contact</a></li>
      </ul>
    </div>
  </nav>
  
   <div class="max-w-md mx-auto mt-20 mb-20 p-8 bg-slate-900/60 backdrop-blur-xl rounded-[2rem] border border-cyan-500/20 shadow-2xl relative overflow-hidden">
    
    <h2 class="text-3xl font-black text-white uppercase tracking-tighter mb-8 text-center bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-500">
        Contact Terminal Port
    </h2>

    <form action="#" method="POST" class="space-y-5">
        
        <div class="flex flex-col sm:flex-row gap-4">
            <div class="flex-1 group">
                <label class="block text-[10px] uppercase tracking-[0.2em] text-cyan-400/70 font-bold mb-1 ml-4">First Name</label>
                <input type="text" name="first-name" required placeholder="Entry ID"
                    class="w-full bg-slate-950/50 border border-slate-800 text-white px-5 py-3 rounded-2xl outline-none 
                    focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/20 transition-all placeholder:text-slate-700">
            </div>
            <div class="flex-1 group">
                <label class="block text-[10px] uppercase tracking-[0.2em] text-cyan-400/70 font-bold mb-1 ml-4">Last Name</label>
                <input type="text" name="last-name" required placeholder="Legacy Name"
                    class="w-full bg-slate-950/50 border border-slate-800 text-white px-5 py-3 rounded-2xl outline-none 
                    focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/20 transition-all placeholder:text-slate-700">
            </div>
        </div>

        <div class="group">
            <label class="block text-[10px] uppercase tracking-[0.2em] text-cyan-400/70 font-bold mb-1 ml-4">Gmail Interface</label>
            <input type="email" name="email" required placeholder="user@gmail.com"
                class="w-full bg-slate-950/50 border border-slate-800 text-white px-5 py-3 rounded-2xl outline-none 
                focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/20 transition-all placeholder:text-slate-700">
        </div>

        <div class="group">
            <label class="block text-[10px] uppercase tracking-[0.2em] text-cyan-400/70 font-bold mb-1 ml-4">Access Key</label>
            <input type="password" placeholder="••••••••" 
                class="w-full bg-slate-950/50 border border-slate-800 text-white px-5 py-3 rounded-2xl outline-none 
                focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/20 transition-all placeholder:text-slate-700">
        </div>

        <button type="submit" 
            class="w-full py-4 mt-4 bg-cyan-600 hover:bg-cyan-500 text-white font-black uppercase tracking-widest
            rounded-2xl shadow-[0_0_15px_rgba(8,145,178,0.4)] transition-all active:scale-[0.98]">
            Enter Wasteland
        </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-800 flex justify-center items-center">
        <a href="https://www.facebook.com/christian.atanacio.escalada" target="facebook" 
            class="group flex items-center gap-3 text-slate-500 hover:text-blue-500 transition-colors">
            <svg class="w-6 h-6 fill-current" 
            viewBox="0 0 24 24">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 
                11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 
                2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 
                3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            <span class="text-[10px] font-bold uppercase tracking-widest">Connect to Network</span>
        </a>
    </div>
</div>
 <footer class="py-12 mt-10 text-center">
        <p class="text-[15px] uppercase tracking-[0.5em] text-blue-500">Navarro • 2026</p>
    </footer>
</body>
</html>
